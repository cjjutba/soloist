name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (don't pile up redundant CI on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Format-valid PLACEHOLDERS only — `next build` never connects to the DB, and
      # `drizzle-kit generate` is offline (diffs the schema against the committed
      # drizzle/meta snapshot). No real secrets in CI. (Sentry is DSN-less → disabled.)
      DATABASE_URL: postgresql://user:pass@localhost:5432/soloist
      BETTER_AUTH_SECRET: ci-placeholder-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Migration drift check
        run: |
          npm run db:generate
          git diff --exit-code drizzle || {
            echo "::error::Schema drifted from migrations — run 'npm run db:generate' and commit the new migration."
            exit 1
          }
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
